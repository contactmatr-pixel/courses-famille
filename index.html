        // Références Firebase en mémoire

            db: null,
            auth: null,

        // ==========================================
        // INITIALISATION & SYNCHRONISATION TEMPS RÉEL FIRESTORE
        // ==========================================
        async function initCloudSync() {
            // Charger les données initiales en mémoire en attendant la réponse Cloud
            state.lists = JSON.parse(JSON.stringify(DEFAULT_DATA.lists));
            state.archivedLists = JSON.parse(JSON.stringify(DEFAULT_DATA.archivedLists));

            try {
                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                const hasEnvConfig = typeof __firebase_config !== 'undefined';
                const config = hasEnvConfig ? JSON.parse(__firebase_config) : FIREBASE_USER_CONFIG;
                fb.appId = typeof __app_id !== 'undefined' ? __app_id : 'courses-famille-app';

                // Vérifie si l'utilisateur a bien rempli sa configuration Firebase
                if (!hasEnvConfig && config.apiKey === "REMPLACE_PAR_TON_API_KEY") {
                    console.warn("Firebase non encore configuré : fonctionnement en mémoire locale.");
                    render();
                    return;
                }

                const app = initializeApp(config);
                fb.auth = getAuth(app);
                fb.db = getFirestore(app);
                fb.doc = doc;
                fb.setDoc = setDoc;

                // RULE 3 : Authentification AVANT toute requête Firestore
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(fb.auth, __initial_auth_token);
                } else {
                    await signInAnonymously(fb.auth);
                }
                fb.user = fb.auth.currentUser;
                if (!fb.user) return;

                // RULE 1 : Chemin strict /artifacts/{appId}/public/data/{collectionName}/{docId}
                const familyDocRef = doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'family_courses', 'main_state');

                // Écoute en temps réel sur les 4 téléphones
                onSnapshot(familyDocRef, (snapshot) => {
                    state.cloudReady = true;
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        state.lists = Array.isArray(data.lists) ? data.lists : [];
                        state.archivedLists = Array.isArray(data.archivedLists) ? data.archivedLists : [];
                    } else {
                        // Premier lancement sur Firebase : initialise la base avec l'exemple
                        saveData();
                    }
                    render();
                }, (error) => {
                    console.error("Erreur écoute Firestore :", error);
                    showToast("Erreur de synchronisation Cloud");
                });

                // Initialisation optionnelle de Firebase Cloud Messaging (Push iOS)
                try {
                    const { getMessaging, getToken, onMessage } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js");
                    fb.messaging = getMessaging(app);
                    fb.getToken = getToken;

                    // Réception d'une notification quand l'application est ouverte au premier plan
                    onMessage(fb.messaging, (payload) => {
                        const title = payload.notification?.title || 'Courses Famille 🛒';
                        const body = payload.notification?.body || 'La liste de courses a été mise à jour !';
                        showToast(`${title} : ${body}`);
                    });
                } catch (msgErr) {
                    console.info("Messaging non disponible sur ce navigateur :", msgErr);
                }
            } catch (e) {
                console.error("Erreur initialisation Firebase :", e);
            }
        }

        async function saveData() {
            if (!fb.user || !fb.db || !fb.doc || !fb.setDoc) return;
            try {
                const familyDocRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'family_courses', 'main_state');
                await fb.setDoc(familyDocRef, {
                    lists: state.lists,
                    archivedLists: state.archivedLists,
                    updatedAt: Date.now(),
                    updatedBy: state.currentUser || 'unknown'
                });
            } catch (e) {
                console.error('Erreur sauvegarde Firestore:', e);
                showToast('Erreur sauvegarde en ligne');
            }
        }

        // ==========================================

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                el.classList.add('hidden');
            }, 2400);
        }

        function openConfirmModal(title, message, confirmText, onConfirm, isPositive = false) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            const confirmBtn = document.getElementById('modal-confirm');
            confirmBtn.textContent = confirmText || 'Confirmer';
            confirmBtn.className = `flex-1 py-3.5 text-[16px] font-bold ${isPositive ? 'text-blue-600' : 'text-red-600'} active:bg-slate-100 transition`;

            modal.classList.remove('hidden');

            const close = () => {
                modal.classList.add('hidden');
            };

            document.getElementById('modal-cancel').onclick = close;
            confirmBtn.onclick = () => {
                close();
                onConfirm();
            };
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        function getFormattedDate() {
            const now = new Date();
            return now.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ' à ' + getCurrentTime();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function isAdmin() {
            return state.currentUser && USERS[state.currentUser]?.role === 'admin';
        }

        function handleCreateListSubmit(e) {
            e.preventDefault();
            if (!isAdmin()) return;

            const storeSelect = document.getElementById('store-select').value;
            const customStoreInput = document.getElementById('custom-store-input')?.value.trim();
            const noteInput = document.getElementById('list-note-input').value.trim();
            const bulkItemsRaw = document.getElementById('bulk-items-input')?.value || '';

            let finalStore = storeSelect;
            if (storeSelect === 'Autre') {
                if (!customStoreInput) {
                    showToast('Précise le nom du magasin');
                    return;
                }
                finalStore = customStoreInput;
            }

            // Découpage des articles rapides par virgules ou retours à la ligne
            const initialItems = bulkItemsRaw
                .split(/[\n,]+/)
                .map(s => s.trim())
                .filter(Boolean)
                .map((itemName, index) => ({
                    id: 'item-' + Date.now() + '-' + index,
                    name: itemName.charAt(0).toUpperCase() + itemName.slice(1),
                    description: '',
                    addedBy: state.currentUser,
                    checked: false,
                    comments: []
                }));

            const newList = {
                id: 'list-' + Date.now(),
                store: finalStore,
                note: noteInput,
                createdBy: state.currentUser,
                createdAt: 'Aujourd’hui, ' + getCurrentTime(),
                items: initialItems
            };

            state.lists.unshift(newList);
            saveData();
            triggerLocalNotification('Nouvelle liste de courses 🛒', `${USERS[state.currentUser].name} a créé la liste ${finalStore}`);
            showToast(`Liste "${finalStore}" créée !`);
            openList(newList.id);
        }

        // Terminer et envoyer la liste aux ARCHIVES
        function archiveList(listId, event) {
            if (event) event.stopPropagation();
            if (!isAdmin()) return;

            const list = state.lists.find(l => l.id === listId);
            if (!list) return;

            openConfirmModal(
                'Terminer & archiver ?',
                `La liste "${list.store}" sera clôturée et sauvegardée dans les Archives pour pouvoir la réutiliser plus tard.`,
                'Archiver',
                () => {
                    const archivedCopy = {
                        ...JSON.parse(JSON.stringify(list)),
                        archivedAt: getFormattedDate(),
                        archivedBy: state.currentUser
                    };

                    state.archivedLists.unshift(archivedCopy);
                    state.lists = state.lists.filter(l => l.id !== listId);
                    saveData();
                    showToast('Liste archivée avec succès !');
                    if (state.view === 'list-detail') {
                        goBackToDashboard();
                    } else {
                        render();
                    }
                },
                true
            );
        }

        // Ouvrir la fenêtre de configuration de réutilisation d'une archive
        function openReuseArchiveModal(archiveId, event) {
            if (event) event.stopPropagation();
            if (!isAdmin()) return;
            state.reuseModalArchiveId = archiveId;
            render();
        }

        function closeReuseArchiveModal() {
            state.reuseModalArchiveId = null;
            render();
        }

        // Confirmer la recréation d'une liste active depuis une archive
        function handleConfirmReuseArchive(e) {
            e.preventDefault();
            if (!isAdmin() || !state.reuseModalArchiveId) return;

            const archive = state.archivedLists.find(a => a.id === state.reuseModalArchiveId);
            if (!archive) return;

            const storeSelect = document.getElementById('reuse-store-select').value;
            const customStoreInput = document.getElementById('reuse-custom-store')?.value.trim();
            const noteInput = document.getElementById('reuse-note-input').value.trim();
            const keepComments = document.getElementById('reuse-keep-comments').checked;

            let finalStore = storeSelect;
            if (storeSelect === 'Autre') {
                if (!customStoreInput) {
                    showToast('Précise le nom du magasin');
                    return;
                }
                finalStore = customStoreInput;
            }

            // Recopie propre de tous les articles (décochés par défaut)
            const clonedItems = (archive.items || []).map((item, idx) => ({
                id: 'item-' + Date.now() + '-' + idx,
                name: item.name,
                description: item.description || '',
                addedBy: item.addedBy || state.currentUser,
                checked: false,
                comments: keepComments ? JSON.parse(JSON.stringify(item.comments || [])) : []
            }));

            const restoredList = {
                id: 'list-' + Date.now(),
                store: finalStore,
                note: noteInput,
                createdBy: state.currentUser,
                createdAt: 'Aujourd’hui, ' + getCurrentTime(),
                items: clonedItems
            };

            state.lists.unshift(restoredList);
            state.reuseModalArchiveId = null;
            saveData();
            showToast(`Liste "${finalStore}" recréée (${clonedItems.length} articles) !`);
            openList(restoredList.id);
        }

        // Supprimer définitivement une archive
        function deleteArchivePermanently(archiveId, event) {
            if (event) event.stopPropagation();
            if (!isAdmin()) return;

            const archive = state.archivedLists.find(a => a.id === archiveId);
            if (!archive) return;

            openConfirmModal(
                'Supprimer définitivement ?',
                `L’archive "${archive.store}" (${archive.archivedAt}) sera effacée pour toujours.`,
                'Supprimer',
                () => {
                    state.archivedLists = state.archivedLists.filter(a => a.id !== archiveId);
                    saveData();
                    showToast('Archive supprimée');
                    if (state.view === 'archive-detail') {
                        openArchives();
                    } else {
                        render();
                    }
                }
            );
        }

        function handleAddItem(e) {
            e.preventDefault();
            const nameInput = document.getElementById('new-item-name');
            const descInput = document.getElementById('new-item-desc');

            const rawNames = nameInput.value.trim();
            const description = descInput ? descInput.value.trim() : '';

            if (!rawNames) {
                showToast('Indique le nom du produit');
                return;
            }

            const list = state.lists.find(l => l.id === state.activeListId);
            if (!list) return;

            // Supporte aussi l'ajout multiple séparé par virgule ou saut de ligne
            const entries = rawNames.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
            entries.forEach((entry, idx) => {
                list.items.push({
                    id: 'item-' + Date.now() + '-' + idx,
                    name: entry.charAt(0).toUpperCase() + entry.slice(1),
                    description: entries.length === 1 ? description : '',
                    addedBy: state.currentUser,
                    checked: false,
                    comments: []
                });
            });

            saveData();
            state.showAddItemForm = false;
            state.showAddItemDetails = false;
            showToast(entries.length > 1 ? `${entries.length} produits ajoutés !` : 'Produit ajouté !');
            render();
        }

        function toggleItemCheck(itemId, event) {
            if (event) event.stopPropagation();
            const list = state.lists.find(l => l.id === state.activeListId);
            if (!list) return;

            const item = list.items.find(i => i.id === itemId);
            if (item) {
                item.checked = !item.checked;
                saveData();
                render();
            }
        }

        function deleteItem(itemId, event) {
            if (event) event.stopPropagation();
            const list = state.lists.find(l => l.id === state.activeListId);
            if (!list) return;

            list.items = list.items.filter(i => i.id !== itemId);
            saveData();
            showToast('Article retiré');
            render();
        }

        function toggleItemComments(itemId) {
            state.expandedItems[itemId] = !state.expandedItems[itemId];
            render();
            if (state.expandedItems[itemId]) {
                setTimeout(() => {
                    const input = document.getElementById(`comment-input-${itemId}`);
                    if (input) input.focus();
                }, 60);
            }
        }

        function handleAddComment(itemId, e) {
            e.preventDefault();
            e.stopPropagation();
            const input = document.getElementById(`comment-input-${itemId}`);
            const text = input.value.trim();
            if (!text) return;

            const list = state.lists.find(l => l.id === state.activeListId);
            if (!list) return;

            const item = list.items.find(i => i.id === itemId);
            if (!item) return;

            item.comments.push({
                id: 'c-' + Date.now(),
                author: state.currentUser,
                text: text,
                time: getCurrentTime()
            });

            state.expandedItems[itemId] = true;
            saveData();
            render();
        }

        // Demande d'autorisation de notifications Push iOS / Web + enregistrement du Token FCM
        async function enableNotifications() {
            if (!('Notification' in window)) {
                showToast('Sur iPhone : ajoute d’abord l’appli à l’écran d’accueil Safari');
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    showToast('Notifications activées sur ce téléphone !');

                    // Enregistrement du Service Worker et récupération du jeton Push Firebase
                    if ('serviceWorker' in navigator && fb.messaging && fb.getToken && VAPID_PUBLIC_KEY !== "REMPLACE_PAR_TA_CLE_VAPID_WEB_PUSH") {
                        const registration = await navigator.serviceWorker.register('./service-worker.js');
                        const fcmToken = await fb.getToken(fb.messaging, {
                            vapidKey: VAPID_PUBLIC_KEY,
                            serviceWorkerRegistration: registration
                        });

                        if (fcmToken && fb.user && fb.db && state.currentUser) {
                            const tokenDocRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'push_tokens', state.currentUser);
                            await fb.setDoc(tokenDocRef, {
                                userId: state.currentUser,
                                name: USERS[state.currentUser].name,
                                token: fcmToken,
                                updatedAt: Date.now()
                            });
                        }
                    }

                    new Notification('Courses Famille 🛒', {
                        body: 'Tu seras prévenu dès qu’une nouvelle liste est créée !'
                    });
                } else {
                    showToast('Autorisation refusée dans les réglages');
                }
                render();
            } catch (err) {
                console.error(err);
                showToast('Ajoute d’abord la page à l’écran d’accueil iPhone');
            }
        }

                } catch (e) {}
            }
        }

                    <h3 class="text-[16px] font-bold text-slate-800">La liste est encore vide</h3>
                    <p class="text-[13px] text-slate-500 mt-1">Ajoute le premier produit ci-dessous !</p>
                </div>
            ` : sortedItems.map(item => {
                const author = USERS[item.addedBy] || USERS.olivier;
                const hasComments = item.comments && item.comments.length > 0;
                // Ouvert si l'utilisateur a cliqué dessus OU s'il y a déjà des commentaires
                const isCommentsOpen = Boolean(state.expandedItems[item.id]) || hasComments;

                const bubblesHTML = (item.comments || []).map(c => {
                    const cAuthor = USERS[c.author] || USERS.olivier;
                    const isMine = c.author === state.currentUser;
                    return `
                        <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'} mb-2 last:mb-0">
                            <span class="text-[10.5px] font-bold mb-0.5 px-1" style="color: ${cAuthor.color}">
                                ${cAuthor.name} • ${c.time}
                            </span>
                            <div class="sms-bubble ${isMine ? 'sms-bubble-mine text-white' : 'sms-bubble-other text-white'} text-[13.5px] shadow-2xs"
                                 style="background-color: ${cAuthor.color};">
                                ${escapeHTML(c.text)}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-[24px] shadow-2xs border border-slate-200/70 overflow-hidden transition-all ${item.checked ? 'opacity-65' : ''}"
                         style="border-left: 5px solid ${author.color};">
                        
                        <!-- Ligne principale du produit (cliquable pour ouvrir les commentaires) -->
                        <div onclick="toggleItemComments('${item.id}')" class="p-3.5 flex items-start gap-3 cursor-pointer active:bg-slate-50/80 transition">
                            <!-- Case à cocher panier -->
                            <button onclick="toggleItemCheck('${item.id}', event)"
                                class="mt-0.5 w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 transition"
                                style="border-color: ${item.checked ? '#10B981' : '#CBD5E1'}; background-color: ${item.checked ? '#10B981' : 'transparent'};">
                                ${item.checked ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white stroke-[3]"></i>' : ''}
                            </button>

                            <!-- Nom + Description + Badge auteur -->
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-2">
                                    <h4 class="text-[16px] font-bold text-slate-900 leading-snug ${item.checked ? 'line-through text-slate-400' : ''}">
                                        ${escapeHTML(item.name)}
                                    </h4>
                                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-full shrink-0"
                                          style="background-color: ${author.bgLight}; color: ${author.textDark};">
                                        ${author.name}
                                    </span>
                                </div>

                                ${item.description ? `
                                    <p class="text-[13px] text-slate-500 mt-0.5 leading-snug">
                                        ${escapeHTML(item.description)}
                                    </p>
                                ` : ''}
                            </div>

                            <!-- Bouton supprimer l'article (visible pour l'auteur ou les admins) -->
                            ${(admin || item.addedBy === state.currentUser) ? `
                                <button onclick="deleteItem('${item.id}', event)" title="Retirer l'article"
                                    class="p-1.5 text-slate-300 hover:text-red-500 active:text-red-600 transition shrink-0">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            ` : ''}
                        </div>

                        <!-- Zone de discussion SMS (visible uniquement si commentaires existants ou produit cliqué) -->
                        ${isCommentsOpen ? `
                            <div class="bg-[#F8F8FA] border-t border-slate-100 px-3.5 py-3 animate-fade-in">
                                ${hasComments ? `
                                    <div class="mb-2.5 max-h-48 overflow-y-auto no-scrollbar">
                                        ${bubblesHTML}
                                    </div>
                                ` : `
                                    <p class="text-[11.5px] text-slate-400 mb-2 text-center">
                                        Une précision ou un changement d’avis sur ce produit ?
                                    </p>
                                `}

                                <!-- Champ d'envoi rapide style SMS -->
                                <form onsubmit="handleAddComment('${item.id}', event)" class="flex items-center gap-2">
                                    <input type="text" id="comment-input-${item.id}"
                                        placeholder="Écrire en tant que ${currentUserObj.name}..."
                                        class="flex-1 bg-white border border-slate-200/90 rounded-full px-3.5 py-2 text-[13px] focus:outline-none focus:border-slate-400">
                                    <button type="submit"
                                        class="w-8 h-8 rounded-full text-white flex items-center justify-center shrink-0 active:scale-90 transition shadow-2xs"
                                        style="background-color: ${currentUserObj.color};">
                                        <i data-lucide="arrow-up" class="w-4 h-4 stroke-[2.5]"></i>
                                    </button>
                                </form>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <!-- En-tête de la liste -->
                <header class="glass-header sticky top-0 z-30 px-4 py-3 border-b border-slate-200/70 shrink-0">
                    <div class="flex items-center justify-between">
                        <button onclick="goBackToDashboard()" class="flex items-center gap-1 text-blue-600 font-semibold text-[15px] py-1 pr-2 active:opacity-60">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                            Listes
                        </button>
                        <div class="flex items-center gap-2">
                            ${admin ? `
                                <button onclick="archiveList('${list.id}', event)" title="Terminer & archiver la liste"
                                    class="px-2.5 py-1.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200/80 flex items-center gap-1 text-[12px] font-bold active:bg-amber-100 transition">
                                    <i data-lucide="archive" class="w-3.5 h-3.5"></i>
                                    Archiver
                                </button>
                            ` : ''}
                            ${renderTopProfileBadge()}
                        </div>
                    </div>

                    <div class="mt-2 flex items-baseline justify-between">
                        <div>
                            <h1 class="text-[22px] font-extrabold text-slate-900 leading-tight">${escapeHTML(list.store)}</h1>
                            <p class="text-[12px] text-slate-500 flex items-center gap-1.5 mt-0.5">
                                <span class="w-2 h-2 rounded-full" style="background-color: ${creator.color}"></span>
                                Liste ouverte par <strong class="text-slate-700">${creator.name}</strong>
                            </p>
                        </div>
                        <span class="text-[12px] font-bold text-slate-500 bg-slate-200/70 px-2.5 py-1 rounded-full">
                            ${list.items.filter(i => i.checked).length}/${list.items.length} pris
                        </span>
                    </div>
                </header>

                <!-- Corps défilant des articles -->
                <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3 pb-32">
                    ${itemsHTML}
                </main>

                <!-- Tiroir ou Barre fixe d'ajout d'article (accessible à TOUS) -->
                <div class="absolute bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-xl border-t border-slate-200/80 p-3.5 shadow-[0_-10px_30px_rgba(0,0,0,0.06)]">
                    ${state.showAddItemForm ? `
                        <form onsubmit="handleAddItem(event)" class="space-y-2.5 animate-slide-up">
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-[12px] font-bold uppercase tracking-wider" style="color: ${currentUserObj.color}">
                                    Ajouter un produit (${currentUserObj.name})
                                </span>
                                <button type="button" onclick="state.showAddItemForm = false; state.showAddItemDetails = false; render();" class="text-xs font-semibold text-slate-400 px-2 py-1">
                                    Fermer
                                </button>
                            </div>
                            <input type="text" id="new-item-name" required placeholder="Nom du produit (ex: Granola, Prince, Lait...)"
                                class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 text-[15px] font-medium focus:outline-none focus:ring-2 focus:ring-slate-900">
                            
                            <!-- Accordéon dépliable pour les précisions -->
                            <div>
                                <button type="button" onclick="state.showAddItemDetails = !state.showAddItemDetails; render();"
                                    class="flex items-center gap-1.5 text-[12.5px] font-semibold text-slate-600 py-1">
                                    <i data-lucide="${state.showAddItemDetails ? 'chevron-down' : 'chevron-right'}" class="w-4 h-4"></i>
                                    Ajouter des précisions / infos
                                </button>
                                ${state.showAddItemDetails ? `
                                    <input type="text" id="new-item-desc" placeholder="Marque, quantité, parfum, lien ou note spéciale..."
                                        class="mt-1.5 w-full px-3.5 py-2.5 rounded-xl bg-slate-100 text-[13.5px] focus:outline-none focus:ring-2 focus:ring-slate-900 animate-fade-in">
                                ` : ''}
                            </div>

                            <button type="submit"
                                class="w-full py-3 rounded-xl text-white font-bold text-[15px] shadow-md active:scale-[0.98] transition"
                                style="background-color: ${currentUserObj.color};">
                                Ajouter à la liste
                            </button>
                        </form>
                    ` : `
                        <button onclick="state.showAddItemForm = true; render(); setTimeout(() => document.getElementById('new-item-name')?.focus(), 50);"
                            class="w-full py-3.5 px-4 rounded-2xl text-white font-bold text-[15px] flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition"
                            style="background-color: ${currentUserObj.color};">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i>
                            Ajouter un produit à la liste
                        </button>
                    `}
                </div>
            `;
        }

        // 5. ÉCRAN LISTE DES ARCHIVES
        function renderArchives() {
            const admin = isAdmin();

            const archivesHTML = state.archivedLists.length === 0 ? `
                <div class="flex flex-col items-center justify-center text-center py-14 px-6 bg-white rounded-[28px] border border-slate-200/60 shadow-xs mt-2">
                    <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-3">
                        <i data-lucide="archive" class="w-7 h-7"></i>
                    </div>
                    <h3 class="text-[17px] font-bold text-slate-800">Aucune liste archivée</h3>
                    <p class="text-[13.5px] text-slate-500 mt-1 max-w-[260px]">
                        Quand Olivier ou Ermine terminera une liste de courses, elle apparaîtra ici pour pouvoir être réutilisée.
                    </p>
                </div>
            ` : state.archivedLists.map(arch => {
                const creator = USERS[arch.createdBy] || USERS.olivier;
                const storeMeta = STORES.find(s => s.name === arch.store) || { icon: '🛍️', badgeColor: 'bg-slate-100 text-slate-700' };
                const itemsPreview = (arch.items || []).slice(0, 4).map(i => i.name).join(', ');

                return `
                    <div onclick="openArchiveDetail('${arch.id}')"
                        class="bg-white rounded-[24px] p-4 shadow-2xs border border-slate-200/80 active:scale-[0.98] transition cursor-pointer">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-2xl bg-slate-100 flex items-center justify-center text-xl shrink-0">
                                    ${storeMeta.icon}
                                </div>
                                <div>
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h3 class="text-[17px] font-bold text-slate-900">${escapeHTML(arch.store)}</h3>
                                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                                            ${(arch.items || []).length} produit${(arch.items || []).length > 1 ? 's' : ''}
                                        </span>
                                    </div>
                                    <p class="text-[12px] text-slate-500 mt-0.5">
                                        Archivée le <strong class="text-slate-700">${escapeHTML(arch.archivedAt || arch.createdAt)}</strong> • par ${creator.name}
                                    </p>
                                </div>
                            </div>

                            ${admin ? `
                                <button onclick="deleteArchivePermanently('${arch.id}', event)" title="Supprimer définitivement"
                                    class="p-2 rounded-full text-slate-300 hover:text-red-500 active:bg-red-50 active:text-red-600 transition shrink-0">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            ` : ''}
                        </div>

                        ${itemsPreview ? `
                            <p class="mt-2.5 text-[12.5px] text-slate-500 bg-slate-50 px-3 py-2 rounded-xl truncate">
                                ${escapeHTML(itemsPreview)}${(arch.items || []).length > 4 ? '...' : ''}
                            </p>
                        ` : ''}

                        <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between gap-2">
                            <span class="text-[12.5px] font-semibold text-slate-500 flex items-center gap-1">
                                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                Voir le détail
                            </span>

                            ${admin ? `
                                <button onclick="openReuseArchiveModal('${arch.id}', event)"
                                    class="px-3.5 py-1.5 rounded-full bg-slate-900 text-white text-[12.5px] font-bold flex items-center gap-1.5 shadow-xs active:scale-95 transition">
                                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                                    Réutiliser cette liste
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <header class="glass-header sticky top-0 z-30 px-4 py-3 border-b border-slate-200/70 flex items-center justify-between shrink-0">
                    <button onclick="goBackToDashboard()" class="flex items-center gap-1 text-blue-600 font-semibold text-[15px] py-1 pr-2 active:opacity-60">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        Accueil
                    </button>
                    <h2 class="text-[17px] font-bold text-slate-900">Archives (${state.archivedLists.length})</h2>
                    ${renderTopProfileBadge()}
                </header>

                <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3 pb-10 animate-fade-in">
                    <div class="bg-blue-50/80 border border-blue-100 rounded-2xl p-3.5 flex items-start gap-2.5">
                        <i data-lucide="sparkles" class="w-4 h-4 text-blue-600 shrink-0 mt-0.5"></i>
                        <p class="text-[12.5px] text-blue-900 leading-snug">
                            ${admin 
                                ? 'Reprends une ancienne liste en 1 clic pour recréer instantanément une nouvelle session modifiable par toute la famille.' 
                                : 'Consulte ici toutes les anciennes listes de courses de la famille.'}
                        </p>
                    </div>

                    ${archivesHTML}
                </main>

                ${renderReuseArchiveModal()}
            `;
        }

        // 6. ÉCRAN DÉTAIL D'UNE LISTE ARCHIVÉE
        function renderArchiveDetail() {
            const arch = state.archivedLists.find(a => a.id === state.activeArchiveId);
            if (!arch) {
                openArchives();
                return '';
            }

            const creator = USERS[arch.createdBy] || USERS.olivier;
            const currentUserObj = USERS[state.currentUser];
            const admin = isAdmin();

            const itemsHTML = (arch.items || []).map(item => {
                const author = USERS[item.addedBy] || USERS.olivier;
                const hasComments = item.comments && item.comments.length > 0;

                const bubblesHTML = (item.comments || []).map(c => {
                    const cAuthor = USERS[c.author] || USERS.olivier;
                    return `
                        <div class="flex flex-col items-start mb-1.5 last:mb-0">
                            <span class="text-[10.5px] font-bold mb-0.5 px-1" style="color: ${cAuthor.color}">
                                ${cAuthor.name} • ${c.time}
                            </span>
                            <div class="sms-bubble sms-bubble-other text-white text-[13px]"
                                 style="background-color: ${cAuthor.color};">
                                ${escapeHTML(c.text)}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-[22px] shadow-2xs border border-slate-200/70 overflow-hidden"
                         style="border-left: 5px solid ${author.color};">
                        <div class="p-3.5 flex items-start justify-between gap-2">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-2">
                                    <h4 class="text-[15.5px] font-bold text-slate-900">${escapeHTML(item.name)}</h4>
                                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-full shrink-0"
                                          style="background-color: ${author.bgLight}; color: ${author.textDark};">
                                        ${author.name}
                                    </span>
                                </div>
                                ${item.description ? `
                                    <p class="text-[13px] text-slate-500 mt-0.5">${escapeHTML(item.description)}</p>
                                ` : ''}
                            </div>
                        </div>

                        ${hasComments ? `
                            <div class="bg-[#F8F8FA] border-t border-slate-100 px-3.5 py-2.5">
                                ${bubblesHTML}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            return `
                <header class="glass-header sticky top-0 z-30 px-4 py-3 border-b border-slate-200/70 shrink-0">
                    <div class="flex items-center justify-between">
                        <button onclick="openArchives()" class="flex items-center gap-1 text-blue-600 font-semibold text-[15px] py-1 pr-2 active:opacity-60">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                            Archives
                        </button>
                        <div class="flex items-center gap-2">
                            ${admin ? `
                                <button onclick="deleteArchivePermanently('${arch.id}', event)" title="Supprimer définitivement"
                                    class="w-8 h-8 rounded-full bg-red-50 text-red-600 flex items-center justify-center active:bg-red-100 transition">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            ` : ''}
                            ${renderTopProfileBadge()}
                        </div>
                    </div>

                    <div class="mt-2 flex items-baseline justify-between">
                        <div>
                            <div class="flex items-center gap-2">
                                <h1 class="text-[21px] font-extrabold text-slate-900 leading-tight">${escapeHTML(arch.store)}</h1>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">Archive</span>
                            </div>
                            <p class="text-[12px] text-slate-500 mt-0.5">
                                Archivée le <strong>${escapeHTML(arch.archivedAt || arch.createdAt)}</strong> (créée par ${creator.name})
                            </p>
                        </div>
                    </div>
                </header>

                <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3 pb-28">
                    ${arch.note ? `
                        <div class="bg-white rounded-2xl p-3 border border-slate-200/70 text-[13px] text-slate-600">
                            📝 ${escapeHTML(arch.note)}
                        </div>
                    ` : ''}
                    ${itemsHTML}
                </main>

                ${admin ? `
                    <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-[#F2F2F7] via-[#F2F2F7]/95 to-transparent pt-6">
                        <button onclick="openReuseArchiveModal('${arch.id}', event)"
                            class="w-full py-3.5 px-5 rounded-2xl text-white font-bold text-[16px] shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition"
                            style="background-color: ${currentUserObj.color}; box-shadow: 0 10px 25px -5px ${currentUserObj.color}80;">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                            Réutiliser cette liste (${(arch.items || []).length} produits)
                        </button>
                    </div>
                ` : ''}

                ${renderReuseArchiveModal()}
            `;
        }

        // MODALE DE CONFIGURATION POUR RÉUTILISER UNE ARCHIVE
        function renderReuseArchiveModal() {
            if (!state.reuseModalArchiveId) return '';
            const archive = state.archivedLists.find(a => a.id === state.reuseModalArchiveId);
            if (!archive) return '';

            const currentUserObj = USERS[state.currentUser];
            const isKnownStore = STORES.some(s => s.name === archive.store && s.name !== 'Autre');
            const initialStoreValue = isKnownStore ? archive.store : 'Autre';

            const storeOptions = STORES.map(s => `
                <option value="${s.name}" ${s.name === initialStoreValue ? 'selected' : ''}>
                    ${s.icon} ${s.name}
                </option>
            `).join('');

            return `
                <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/45 backdrop-blur-xs animate-fade-in">
                    <form onsubmit="handleConfirmReuseArchive(event)"
                        class="bg-white w-full max-w-[430px] rounded-t-[32px] sm:rounded-[32px] p-5 shadow-2xl space-y-4 animate-slide-up">
                        <div class="flex items-center justify-between">
                            <div>
                                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Reprendre une archive</span>
                                <h3 class="text-[19px] font-extrabold text-slate-900">Nouvelle liste depuis l'archive</h3>
                            </div>
                            <button type="button" onclick="closeReuseArchiveModal()"
                                class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <p class="text-[13px] text-slate-600 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                            Les <strong>${(archive.items || []).length} produits</strong> de cette liste seront recopiés et décochés. Toute la famille pourra ensuite en ajouter ou en retirer.
                        </p>

                        <div>
                            <label class="block text-[12.5px] font-bold text-slate-700 mb-1.5">Magasin pour ces nouvelles courses</label>
                            <select id="reuse-store-select"
                                onchange="document.getElementById('reuse-custom-store-box').classList.toggle('hidden', this.value !== 'Autre');"
                                class="w-full px-3.5 py-3 rounded-2xl bg-slate-100 border border-slate-200/80 text-[15px] font-semibold focus:outline-none">
                                ${storeOptions}
                            </select>
                        </div>

                        <div id="reuse-custom-store-box" class="${initialStoreValue === 'Autre' ? '' : 'hidden'}">
                            <label class="block text-[12.5px] font-bold text-slate-700 mb-1">Nom du magasin</label>
                            <input type="text" id="reuse-custom-store" value="${!isKnownStore ? escapeHTML(archive.store) : ''}"
                                placeholder="Ex: Picard, Lidl..."
                                class="w-full px-3.5 py-3 rounded-2xl bg-slate-100 border border-slate-200/80 text-[15px] focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-[12.5px] font-bold text-slate-700 mb-1">Note ou créneau (optionnel)</label>
                            <input type="text" id="reuse-note-input" placeholder="Ex: Courses de la semaine..."
                                class="w-full px-3.5 py-3 rounded-2xl bg-slate-100 border border-slate-200/80 text-[14px] focus:outline-none">
                        </div>

                        <label class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 border border-slate-200/60 cursor-pointer">
                            <input type="checkbox" id="reuse-keep-comments" class="w-4 h-4 rounded accent-slate-900">
                            <span class="text-[13px] text-slate-700 font-medium">
                                Conserver les anciens commentaires SMS (sinon repartir à zéro)
                            </span>
                        </label>

                        <div class="flex gap-2.5 pt-1">
                            <button type="button" onclick="closeReuseArchiveModal()"
                                class="flex-1 py-3.5 rounded-2xl bg-slate-100 text-slate-700 font-bold text-[15px]">
                                Annuler
                            </button>
                            <button type="submit"
                                class="flex-[1.5] py-3.5 rounded-2xl text-white font-bold text-[15px] shadow-md"
                                style="background-color: ${currentUserObj.color};">
                                Recréer la liste
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        // ==========================================
        // RENDU PRINCIPAL
        // ==========================================
        function render() {
            const root = document.getElementById('app-root');
            if (!state.currentUser || state.view === 'profiles') {
                root.innerHTML = renderProfileScreen();
            } else if (state.view === 'dashboard') {
                root.innerHTML = renderDashboard();
            } else if (state.view === 'create-list') {
                root.innerHTML = renderCreateList();
            } else if (state.view === 'list-detail') {
                root.innerHTML = renderListDetail();
            } else if (state.view === 'archives') {
                root.innerHTML = renderArchives();
            } else if (state.view === 'archive-detail') {
                root.innerHTML = renderArchiveDetail();
            }
            lucide.createIcons();
        }

        // Lancement au chargement
        window.addEventListener('DOMContentLoaded', () => {
            render();
            initCloudSync();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./service-worker.js').catch((error) => {
                    console.info('Service Worker non disponible :', error);
                });
            }
        });
    </script>
</body>
</html>
